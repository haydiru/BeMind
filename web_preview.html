<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeMind AI — STAR Method Teleprompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F7FC;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --text-muted: #94A3B8;

      --cyan-bright: #00E5FF;
      --blue-accent: #007AFF;
      --purple-accent: #9333EA;
      --pink-accent: #FF3366;
      --green-accent: #16A34A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #E2E8F0;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Normal Mobile Frame */
    #mobile-frame {
      width: 100%;
      max-width: 410px;
      height: 840px;
      background: var(--bg);
      border-radius: 44px;
      box-shadow: 
        0 25px 65px rgba(15, 23, 42, 0.16),
        0 0 0 10px #FFFFFF,
        0 0 0 11px #CBD5E1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top Header Bar */
    .app-header {
      padding: 20px 24px 12px 24px;
      display: flex;
      align-items: center;
      background: transparent;
      z-index: 10;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #00E5FF 0%, #007AFF 100%);
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0, 229, 255, 0.3);
    }
    .brand-icon svg { width: 20px; height: 20px; fill: #FFFFFF; }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.6px;
    }

    /* App Main Canvas */
    .app-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 85px 20px;
      display: flex;
      flex-direction: column;
    }
    .app-canvas::-webkit-scrollbar { display: none; }

    /* Bottom Glass Navigation Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(226, 232, 240, 0.9);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 6px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #64748B;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 14px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .nav-item:hover { background: #F1F5F9; }

    .nav-item.active {
      color: #007AFF;
      background: #EBF5FF;
      font-weight: 800;
    }

    .nav-item svg { width: 20px; height: 20px; stroke-width: 2.2; stroke: currentColor; fill: none; }

    /* Cards */
    .card {
      background: #FFFFFF;
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    /* ========================================================= */
    /* STAR METHOD TELEPROMPTER FULL CONTAINER LAYOUT */
    /* ========================================================= */
    .teleprompter-full-wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .teleprompter-stage-card-full {
      flex: 1; /* EXPAND FULL VERTICAL HEIGHT TO FILL SCREEN */
      min-height: 380px;
      background: #FFFFFF;
      border-radius: 32px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.05);
      border: 1px solid #E2E8F0;
      position: relative;
      overflow: hidden;
      margin: 12px 0;
    }

    /* Gradient Mask Overlays for Smooth Fading Top & Bottom */
    .mask-fade-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 90px;
      background: linear-gradient(to bottom, rgba(255,255,255,1) 15%, rgba(255,255,255,0) 100%);
      z-index: 10;
      pointer-events: none;
    }

    .mask-fade-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background: linear-gradient(to top, rgba(255,255,255,1) 15%, rgba(255,255,255,0) 100%);
      z-index: 10;
      pointer-events: none;
    }

    /* 60-120 FPS Smooth Scrolling Continuous Track */
    .scroll-track-container {
      width: 100%;
      position: absolute;
      top: 140px; /* Center alignment offset */
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      will-change: transform;
    }

    .prompter-line-item {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.55;
      letter-spacing: -0.4px;
      padding: 12px 24px;
      text-align: center; /* CENTER ALIGNED */
      width: 100%;
      transition: color 0.3s, opacity 0.3s;
    }

    .word-hl {
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .word-hl:hover {
      background: #F3E8FF;
      color: #9333EA;
    }

    /* Bottom Control Group */
    .bottom-controls-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Cyan Play Button */
    .cyan-play-btn {
      width: 60px;
      height: 60px;
      background: #00E5FF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 229, 255, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .cyan-play-btn:hover { transform: scale(1.06); }
    .cyan-play-btn svg { width: 24px; height: 24px; fill: #0F172A; margin-left: 2px; }

    /* WPM Control Bar Pill */
    .wpm-pill-bar {
      width: 100%;
      background: #FFFFFF;
      border-radius: 30px;
      padding: 10px 18px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .star-btn {
      width: 36px;
      height: 36px;
      background: #FFF1F2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF3366;
      font-size: 16px;
      cursor: pointer;
    }

    .wpm-range-input {
      flex: 1;
      accent-color: #00E5FF;
      cursor: pointer;
    }

    /* Chips */
    .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip-btn {
      padding: 8px 14px; border-radius: 20px; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; gap: 6px; cursor: pointer; border: 1px solid transparent;
    }
    .chip-blue { background: #EBF5FF; color: #007AFF; border-color: #CCE5FF; }
    .chip-purple { background: #F3E8FF; color: #9333EA; border-color: #E9D5FF; }
    .chip-green { background: #DCFCE7; color: #16A34A; border-color: #BBF7D0; }
    .chip-orange { background: #FFEDD5; color: #C2410C; border-color: #FED7AA; }

    /* Inputs & Buttons */
    .input-textarea {
      width: 100%; height: 90px; background: #F8FAFC; border: 1px solid #E2E8F0;
      border-radius: 16px; padding: 14px; font-family: inherit; font-size: 13px; color: #0F172A;
      resize: none; outline: none; margin-bottom: 14px;
    }
    .btn-gradient {
      width: 100%; height: 48px; border-radius: 24px; border: none;
      background: linear-gradient(90deg, #00C6FF 0%, #9B51E0 100%);
      color: #FFF; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 10px 24px rgba(155, 81, 224, 0.3); transition: 0.2s;
    }
    .btn-gradient:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Active Projects */
    .project-item {
      background: #F8FAFC; border-radius: 18px; padding: 16px; border: 1px solid #E2E8F0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .btn-purple-sm {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFF; font-size: 11px; font-weight: 700; padding: 8px 14px;
      border-radius: 18px; border: none; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="mobile-frame">

  <!-- Top Header Bar -->
  <div class="app-header">
    <div class="brand-group">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="brand-title">BeMind AI</div>
    </div>
  </div>

  <!-- Main Canvas for Active Page -->
  <div class="app-canvas" id="appCanvas">
    <!-- Rendered dynamically -->
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-0" onclick="navigateTo(0)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Vault</span>
    </div>
    <div class="nav-item" id="nav-1" onclick="navigateTo(1)">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>Generate</span>
    </div>
    <div class="nav-item" id="nav-2" onclick="navigateTo(2)">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      <span>Prompter</span>
    </div>
    <div class="nav-item" id="nav-3" onclick="navigateTo(3)">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Vocab</span>
    </div>
    <div class="nav-item" id="nav-4" onclick="navigateTo(4)">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>Market</span>
    </div>
    <div class="nav-item" id="nav-5" onclick="navigateTo(5)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </div>
  </div>

</div>

<script>
  let activeIndex = 0;
  let isPrompterPlaying = false;
  let animFrameId = null;
  let scrollYPos = 0;
  let wpmSpeed = 164;

  const scriptParagraphs = [
    "In my software engineering career, I",
    "spearheaded the architectural redesign",
    "of our financial transactions API.",
    "Initially, our microservices experienced",
    "severe latency bottlenecks.",
    "I instituted a comprehensive system audit,",
    "implemented a high-performance Redis cache layer,",
    "and reduced endpoint response latency by 45%.",
    "This initiative significantly boosted transaction throughput,",
    "ensuring uninterrupted service during peak user traffic."
  ];

  function animateTeleprompter() {
    if (!isPrompterPlaying) return;

    // Convert WPM speed to pixels per frame (continuous smooth physical scroll)
    const pixelsPerFrame = (wpmSpeed / 60) * 0.4;
    scrollYPos += pixelsPerFrame;

    const track = document.getElementById('teleprompterTrack');
    if (track) {
      track.style.transform = `translateY(-${scrollYPos}px)`;

      // Loop smoothly if end reached
      if (scrollYPos > 460) {
        scrollYPos = 0;
      }
    }

    animFrameId = requestAnimationFrame(animateTeleprompter);
  }

  function toggleContinuousPlay() {
    isPrompterPlaying = !isPrompterPlaying;
    const playIcon = document.getElementById('playIconSvg');

    if (isPrompterPlaying) {
      if (playIcon) playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      animateTeleprompter();
    } else {
      if (playIcon) playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }
  }

  // 6 Complete Pages Render Functions
  const pageContents = [
    // Page 0: Context Vault
    `
    <div class="card">
      <div class="section-title">Strength Overview</div>
      <div style="font-size:13px; color:#64748B;">Personal Context Strength Index: <b style="color:#0F172A;">95</b></div>
    </div>

    <div class="card">
      <div class="section-title">Source Integration</div>
      <div class="chips-row">
        <div class="chip-btn chip-blue">📄 Add Text</div>
        <div class="chip-btn chip-purple">🎤 Add Voice</div>
        <div class="chip-btn chip-green">📝 Upload CV/PDF</div>
        <div class="chip-btn chip-orange">📷 Add Image/OCR</div>
      </div>
      <div style="font-size:13px; font-weight:700; color:#334155; margin-bottom:8px;">Direct Text Input</div>
      <textarea class="input-textarea" placeholder="Paste career summary..."></textarea>
      <button class="btn-gradient" onclick="navigateTo(1)">Enhance My Context</button>
    </div>

    <div class="card">
      <div class="section-title">Active Projects</div>
      <div class="project-item">
        <div>
          <div style="font-weight:700; font-size:14px;">Job Interview Prep (STAR)</div>
          <div style="font-size:11px; color:#64748B; margin-top:2px;">Level C1 • Input types: Text, CV</div>
        </div>
        <button class="btn-purple-sm" onclick="navigateTo(2)">Start Teleprompter</button>
      </div>
    </div>
    `,

    // Page 1: AI Generator
    `
    <div class="card">
      <div class="section-title">✨ AI Narrative Generator</div>
      <div style="font-size:13px; color:#64748B; margin-bottom:14px;">Select speech category target:</div>
      <div class="chips-row">
        <div class="chip-btn chip-blue" style="font-weight:800;">Job Interview</div>
        <div class="chip-btn chip-purple">IELTS Part 2</div>
        <div class="chip-btn chip-green">Elevator Pitch</div>
      </div>
      <button class="btn-gradient" onclick="navigateTo(2)">Synthesize & Launch Prompter</button>
    </div>
    `,

    // Page 2: Teleprompter Reader (STAR METHOD TELEPROMPTER - FULL TOP, FULL CONTAINER, FULL BOTTOM CONTROLS)
    `
    <div class="teleprompter-full-wrapper">
      
      <!-- Top Title Header Bar (FULL AT TOP) -->
      <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
        <div class="section-title" style="margin-bottom:0; font-size:17px;">STAR Method Teleprompter</div>
        <span style="background:#F3E8FF; color:#9333EA; font-weight:700; padding:6px 14px; border-radius:16px; font-size:12px;">60-120 FPS</span>
      </div>

      <!-- 60-120 FPS Continuous Scrolling Stage Box Container (FULL HEIGHT NO EMPTY SPACE) -->
      <div class="teleprompter-stage-card-full">
        <div class="mask-fade-top"></div>
        <div class="mask-fade-bottom"></div>

        <div class="scroll-track-container" id="teleprompterTrack">
          ${scriptParagraphs.map((line) => `
            <div class="prompter-line-item">
              ${line.replace('spearheaded', '<span class="word-hl" onclick="alert(\'spearheaded: Memimpin / Pelopor akselerasi\')">spearheaded</span>').replace('latency', '<span class="word-hl" onclick="alert(\'latency: Waktu tunda server\')">latency</span>')}
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Bottom Control Group (FULL AT BOTTOM) -->
      <div class="bottom-controls-group">
        <!-- Large Cyan Circular Play Button -->
        <div class="cyan-play-btn" onclick="toggleContinuousPlay()">
          <svg viewBox="0 0 24 24" id="playIconSvg"><polygon points="5,3 19,12 5,21"/></svg>
        </div>

        <!-- WPM Slider Bar Pill -->
        <div class="wpm-pill-bar">
          <div class="star-btn" onclick="alert('Saved word to Vocabulary Vault!')">★</div>
          <div style="flex:1; text-align:center;">
            <div style="font-size:11px; font-weight:800; color:#0F172A; margin-bottom:2px;" id="wpmVal">164 WPM</div>
            <input type="range" class="wpm-range-input" min="60" max="300" value="164" oninput="wpmSpeed = this.value; document.getElementById('wpmVal').innerText = this.value + ' WPM';">
          </div>
          <div style="color:#9333EA; font-size:18px; cursor:pointer;">⚙</div>
        </div>
      </div>

    </div>
    `,

    // Page 3: Vocab Vault
    `
    <div class="card">
      <div class="section-title">📚 Personal Vocabulary Vault</div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
        <div style="font-size:18px; font-weight:800; color:#007AFF;">Spearheaded</div>
        <span class="chip-btn chip-green">MASTERED</span>
      </div>
      <div style="color:#16A34A; font-weight:700; font-size:13px; margin-top:4px;">Arti: Memimpin / Pelopor akselerasi</div>
      <div style="font-size:12px; color:#64748B; margin-top:6px; font-style:italic;">"I spearheaded a comprehensive system audit."</div>
    </div>
    `,

    // Page 4: Prompt Marketplace
    `
    <div class="card" style="background: linear-gradient(135deg, #00C6FF, #9B51E0); color:#FFF;">
      <div style="font-size:10px; font-weight:800; background:rgba(255,255,255,0.25); padding:4px 10px; border-radius:12px; display:inline-block;">CANVA FOR PROMPTS</div>
      <div style="font-size:18px; font-weight:800; margin-top:8px;">STAR Tech Interview Master</div>
      <div style="font-size:12px; opacity:0.9; margin-top:4px;">By Sarah Jenkins (Ex-Google Recruiter)</div>
      <button style="margin-top:14px; padding:10px 18px; border-radius:20px; border:none; background:#FFF; color:#000; font-weight:800; cursor:pointer;" onclick="navigateTo(1)">Remix With My Context</button>
    </div>
    `,

    // Page 5: Settings & Lockscreen
    `
    <div class="card">
      <div class="section-title">⚙ On-Device Passive Learning</div>
      <div style="font-size:12px; color:#64748B;">Pushes random vocabulary cards to smartphone lockscreen.</div>
    </div>
    <div style="background:#0F172A; border-radius:24px; padding:20px; color:#FFF; text-align:center;">
      <div style="font-size:32px; font-weight:200;">22:15</div>
      <div style="font-size:11px; opacity:0.7; margin-bottom:12px;">Friday, July 24</div>
      <div style="background:#1E293B; border-radius:16px; padding:14px; text-align:left; border:1px solid rgba(255,255,255,0.1);">
        <div style="font-size:10px; color:#00E5FF; font-weight:800;">BeMind Lockscreen Flashcard</div>
        <div style="font-size:15px; font-weight:700; margin-top:4px;">Spearheaded (/ˈspɪər.hed/)</div>
        <div style="font-size:12px; color:#4ADE80;">Arti: Memimpin / Pelopor akselerasi</div>
      </div>
    </div>
    `
  ];

  function navigateTo(idx) {
    if (isPrompterPlaying) toggleContinuousPlay();
    activeIndex = idx;
    document.getElementById('appCanvas').innerHTML = pageContents[idx];

    for (let i = 0; i < 6; i++) {
      const el = document.getElementById('nav-' + i);
      if (i === idx) el.classList.add('active');
      else el.classList.remove('active');
    }
  }

  // Initial load
  navigateTo(0);
</script>

</body>
</html>
