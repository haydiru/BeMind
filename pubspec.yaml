name: bemind
description: "BeMind — AI-Native English Fluency Builder Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  lucide_icons_flutter: ^3.1.15
  intl: ^0.19.0
  supabase_flutter: ^2.5.0
  http: ^1.2.1
  record: ^7.1.1
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  audioplayers: ^6.8.1
  speech_to_text: ^7.4.0
  flutter_local_notifications: ^17.2.3
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
